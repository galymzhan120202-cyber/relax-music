name: Bedroom R&B Auto Pipeline

on:
  schedule:
    # 24 сағатты 4-ке бөліп, әрқайсысы 6 сағат сайын іске қосылады —
    # барлық видео бір мезгілде емес, күн бойы таралып жүктеледі.
    - cron: "0 3 * * *"   # 08:00 Almaty — Shorts #1
    - cron: "0 9 * * *"   # 14:00 Almaty — Shorts #2
    - cron: "0 15 * * *"  # 20:00 Almaty — Shorts #3
    - cron: "0 21 * * *"  # 02:00 Almaty (келесі күн) — ұзын видео
  workflow_dispatch:
    inputs:
      mode:
        description: "Қай режимде жүргізу керек (қолмен іске қосу үшін)"
        required: true
        default: "shorts"
        type: choice
        options:
          - shorts
          - long

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_PRIVACY_STATUS: "public"
      # HF_TOKEN міндетті емес — тек ашық (public) модель салмақтарын
      # жүктегенде анонимді rate-limit-ке тап болсаңыз пайдалы.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # MusicGen салмақтарын (~1.5GB) күн сайын қайта жүктемеу үшін
      # кэштейміз — бұл workflow уақытын айтарлықтай қысқартады (алғашқы
      # ран-нан кейін).
      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-musicgen-small-v1

      - name: Install PyTorch (CPU-only build — жылдам әрі жеңіл)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Осы триггер cron кестесінің қай уақытында келгеніне қарай режимді
      # таңдайды: 03/09/15 UTC — Shorts, 21 UTC — ұзын видео. Қолмен іске
      # қосқанда (workflow_dispatch) таңдаған mode пайдаланылады.
      - name: Determine mode for this run
        id: pick_mode
        run: |
          case "${{ github.event.schedule }}" in
            "0 21 * * *")
              echo "mode=long" >> "$GITHUB_OUTPUT"
              ;;
            "0 3 * * *"|"0 9 * * *"|"0 15 * * *")
              echo "mode=shorts" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "mode=${{ github.event.inputs.mode || 'shorts' }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run pipeline
        run: python main.py --mode ${{ steps.pick_mode.outputs.mode }}

      - name: Upload generated files as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_id }}
          path: output/
          retention-days: 7
